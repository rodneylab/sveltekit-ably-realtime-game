name: Node
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
permissions: read-all
env:
  PUBLIC_ROWS: 4
  PUBLIC_COLUMNS: 4
  ABLY_API_KEY: 'ABC123'
  PUBLIC_ABLY_CHANNEL: 'some-channel'
  PUBLIC_GITHUB_PAGE: 'github-page'
  PUBLIC_TWITTER_USERNAME: 'twitterUser'
  UPSTASH_REDIS_REST_URL: 'https://upstash.example.com'
  UPSTASH_REDIS_REST_TOKEN: 'ABC123'
jobs:
  test:
    name: Vite Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Format
        run: pnpm run check:formatting
      - name: Check CSS
        run: pnpm run lint:css
      - name: Lint
        run: pnpm run lint
      - name: Check Svelte
        run: pnpm run check
